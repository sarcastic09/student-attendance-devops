groups:
  - name: student-attendance-alerts
    rules:
      - alert: StudentAttendanceApplicationDown
        expr: up{job="student-attendance"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Student Attendance application is down
          description: Prometheus has been unable to scrape the application for at least one minute.
      - alert: HighHostCPUUsage
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 80 percent
          description: Average host CPU usage has exceeded 80 percent for five minutes.
