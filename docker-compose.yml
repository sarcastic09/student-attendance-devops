name: student-attendance
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: attendance-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [monitoring]
  app:
    image: ${DOCKERHUB_USERNAME:-localuser}/student-attendance:latest
    build: .
    container_name: student-attendance-app
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/attendance.db
      SECRET_KEY: ${SECRET_KEY:-local-development-key-change-me}
    ports:
      - "5000:5000"
    volumes:
      - attendance_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [monitoring]
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: attendance-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    depends_on: [app]
    networks: [monitoring]
  grafana:
    image: grafana/grafana:12.1.1
    container_name: attendance-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [monitoring]
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: attendance-node-exporter
    restart: unless-stopped
    ports: ["9100:9100"]
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    networks: [monitoring]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: attendance-cadvisor
    restart: unless-stopped
    ports: ["8085:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]
networks:
  monitoring:
    name: student-attendance-monitoring
volumes:
  attendance_data:
  prometheus_data:
  grafana_data:
  jenkins_home:
